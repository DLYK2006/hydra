syntax = "proto3";

package hydra;

// This is the message that will carry our LLM data
message TensorPacket {
    int32 layer_index = 1;       // Which layer of the model this data belongs to
    repeated float data = 2;     // The actual hidden state vector (activations)
    string device_id = 3;        // The ID of the device sending the data
    repeated int32 shape = 4;    // Logical dimensions of `data`, e.g. [4] for a length-4 vector
    uint64 sequence_id = 5;      // KV cache: 0 = no cache (stateless, pre-KV behaviour); != 0 = cached sequence
    int32 start_pos = 6;         // KV cache: absolute position of data's first row within the sequence
}